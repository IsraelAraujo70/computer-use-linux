[package]
name = "computer-use-linux"
version = "0.7.17"
edition = "2021"
authors = ["Avi Fenesh <avifenesh@users.noreply.github.com>"]
license = "MIT"
description = "Desktop control over MCP for a virtual X11 display (Xvfb + i3): AT-SPI accessibility tree, i3/EWMH window targeting, X11 screenshots, and xdotool input."
homepage = "https://github.com/agent-sh/computer-use-linux"
repository = "https://github.com/agent-sh/computer-use-linux"
documentation = "https://github.com/agent-sh/computer-use-linux#readme"
readme = "README.md"
keywords = ["mcp", "computer-use", "accessibility", "x11", "i3"]
categories = ["accessibility", "command-line-utilities", "os::linux-apis"]

[[bin]]
name = "computer-use-linux"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
futures-util = "0.3.32"
getrandom = "0.4.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
rmcp = { version = "2.1.0", features = ["transport-io"] }
schemars = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.51.1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
# atspi without its "connection" feature: that feature pulls atspi-connection
# with default features, which include "p2p" — and p2p peer enumeration during
# connect() calls GetInterfaces on every a11y-bus peer, so a single
# AppArmor-confined peer (e.g. snap-packaged Slack) aborts the whole
# AccessibilityConnection. We deliberately never use P2P routing (issue #31),
# so depend on atspi-connection directly with p2p off.
atspi = { version = "0.29.0", default-features = false, features = ["proxies", "wrappers", "tokio"] }
atspi-connection = { version = "0.13.0", default-features = false, features = ["wrappers"] }
# Pure-Rust X11 client (no libxcb): root-window screenshots and absolute window
# origins for the EWMH backend (wmctrl -lG counts the frame offset twice, #157).
x11rb = "0.14"
zbus = "5.14.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDate", "NSEnumerator", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFBase", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "objc2", "HIServices", "AXError", "AXUIElement", "AXValue", "AXValueConstants"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "libc", "CGDirectDisplay", "CGEvent", "CGError", "CGEventTypes", "CGGeometry", "CGRemoteOperation", "CGWindow"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSColor", "NSControl", "NSEvent", "NSGraphics", "NSImage", "NSImageView", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSWorkspace"] }

[profile.dev]
# Keep file and line numbers in backtraces without full variable/type debug info.
debug = "line-tables-only"

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"
strip = "symbols"
