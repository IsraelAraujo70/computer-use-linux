# cargo-audit configuration.
#
# Ignored advisories must carry a justification and an unignore condition.
[advisories]
ignore = [
    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml 0.39.x DoS issues
    # (quadratic dup-attribute check, unbounded namespace allocation).
    # quick-xml is reachable only through zbus_xml, which zbus-lockstep (a
    # dependency of atspi-common) uses to read the AT-SPI interface XML that
    # ships inside the atspi crates. It never parses data from the D-Bus bus,
    # the network or the user. (It used to come from wayland-scanner, removed
    # with the X11-only refactor.)
    # Unignore when atspi releases on zbus 6 / zbus_xml >= 6 with quick-xml
    # >= 0.41 (`cargo update -p atspi && cargo tree -i quick-xml`).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # RUSTSEC-2026-0370 / RUSTSEC-2026-0371 / RUSTSEC-2026-0372: zvariant,
    # zbus_names and zvariant_derive are unmaintained as standalone crates;
    # zbus 6 absorbed them. Informational, no vulnerability. They come only
    # through atspi / atspi-common / atspi-connection, whose newest release
    # (atspi 0.30, atspi-common 0.14) still depends on zbus 5, so no upgrade
    # removes them yet.
    # Unignore when atspi releases on zbus >= 6 (`cargo search atspi`, then
    # `cargo tree -i zvariant` should be empty after the upgrade).
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]
