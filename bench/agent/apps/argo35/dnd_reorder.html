<header>Workspace / Prioridades da sprint</header>
<nav>Visão geral　 /　 Meu espaço　 /　 Equipe　 /　 Relatórios</nav>
<main>
<h1>Prioridades da sprint</h1>
<p>Arraste as alças para organizar a sprint.</p>
<div id="list" style="width:750px">
</div>
</main>
<script src="../common.js">
</script>
<script>const ID="a35-dnd-reorder";
const names=["Planejar sprint", "Revisar documenta\u00e7\u00e3o", "Migrar banco de dados", "Corrigir notifica\u00e7\u00f5es", "Atualizar depend\u00eancias", "Otimizar busca", "Validar acessibilidade", "Publicar vers\u00e3o"];
let order=["0", "1", "2", "3", "4", "5", "6", "7"];
const list=document.querySelector('#list');
function render(){
list.replaceChildren(...order.map(id=>h('div',{
class:'row','data-id':id
},h('span',{
class:'handle'
},'⋮⋮'),names[+id],h('small',{

},['Ana Costa','Bruno Lima','Carla Dias','Diego Alves'][+id%4]+' · '+(2+(+id%4))+' pontos · Produto · Sprint 24'))))
}render();
list.onpointerdown=e=>{
if(!e.target.matches('.handle'))return;
const row=e.target.closest('.row'),start=e.clientY;
let active=false,ph;
row.setPointerCapture(e.pointerId);
row.onpointermove=v=>{
if(!active&&Math.abs(v.clientY-start)<6)return;
if(!active){
active=true;
ph=h('div',{
class:'placeholder'
});
row.after(ph);
row.style.opacity='.35';
row.style.position='fixed';
row.style.pointerEvents='none'
}for(const other of list.querySelectorAll('.row')){
if(other===row)continue;
const r=other.getBoundingClientRect();
if(v.clientY<r.y+r.height/2){
list.insertBefore(ph,other);
return
}
}list.append(ph)
};
row.onpointerup=()=>{
if(active){
ph.replaceWith(row);
row.style.opacity='';
row.style.position='';
row.style.pointerEvents='';
order=[...list.querySelectorAll('.row')].map(x=>x.dataset.id);
postState(ID,{
order
})
}row.onpointermove=null;
row.onpointerup=null
}
};
</script>
