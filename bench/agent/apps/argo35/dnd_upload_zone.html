<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Anexos do chamado #4821</title><link rel="stylesheet" href="../style.css"><style>main{max-width:850px;margin:60px auto;background:white;padding:36px;border-radius:16px}button,select,input{padding:12px;margin:10px}canvas{border:1px solid #aaa;touch-action:none}li{padding:12px}label{display:block}.drop{padding:65px;border:2px dashed #678;border-radius:12px}</style><header class="topbar">Portal do cliente</header><main><h1>Anexos do chamado #4821</h1><div class="drop" id="drop">Arraste os arquivos do computador para esta área</div><ul id="list"></ul><button id="send">Enviar anexos</button><p id="status"></p></main><script src="../common.js"></script><script>const ID="a35-dnd-upload-zone";let files=[],sent=[];let pending=Promise.resolve();function emit(){return postState(ID,{sent,selected:files})}async function add(incoming){for(const f of incoming){const bytes=await f.arrayBuffer();const digest=await crypto.subtle.digest('SHA-256',bytes);files.push({name:f.name,size:f.size,sha256:Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('')})}sent=[];render();await emit()}function render(){const list=document.querySelector('#list');list.replaceChildren();files.forEach((f,i)=>{const li=document.createElement('li');li.textContent=f.name+' · '+f.size+' bytes ';const b=document.createElement('button');b.textContent='×';b.setAttribute('aria-label','Remover '+f.name);b.onclick=()=>{files.splice(i,1);sent=[];render();emit()};li.append(b);list.append(li)})}document.querySelector('#send').onclick=async()=>{await pending;sent=files.slice();await emit();document.querySelector('#status').textContent='Envio concluído'};const zone=document.querySelector('#drop');zone.ondragenter=zone.ondragover=e=>{e.preventDefault();zone.style.background='#eaf1fb'};zone.ondragleave=()=>zone.style.background='';zone.ondrop=e=>{e.preventDefault();zone.style.background='';const incoming=Array.from(e.dataTransfer.files);pending=pending.then(()=>add(incoming))};</script></html>
