<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
<style>
body{
margin:0;
background:#f3f5f8;
color:#243247;
font:16px system-ui}
header{
background:#20334c;
color:white;
padding:24px 40px}
main{
margin:35px auto;
max-width:1200px;
background:white;
padding:32px;
border:1px solid #dce2eb;
border-radius:12px}
 .row{
padding:16px;
border-bottom:1px solid #e2e6ed;
display:flex;
gap:30px}
.cursor{
background:#e5efff;
box-shadow:inset 4px 0 #2869ce}
.menu{
position:fixed;
background:white;
border:1px solid #bac4d3;
box-shadow:0 8px 30px #0003;
min-width:210px;
z-index:10}
.menu>
div{
padding:12px;
position:relative}
.menu>
div:hover{
background:#e5efff}
.sub{
display:none;
position:absolute;
left:100%;
top:0}
.parent:hover>
.sub{
display:block}
input{
padding:12px;
font:inherit}
button{
padding:12px 20px}
dialog{
border:1px solid #ccd5e0;
border-radius:12px;
min-width:550px}
pre{
line-height:2;
color:#456}
footer{
margin-top:24px;
color:#65748a}
 .navigation{
position:absolute;
left:24px;
top:110px;
width:180px;
color:#52647a}
.navigation p{
padding:10px;
border-radius:6px;
background:#e9edf3}
main{
margin-left:240px;
margin-right:30px;
max-width:1450px}
.row{
padding:10px;
min-height:28px;
align-items:center}
.chip{
background:#edf0f9;
border-radius:12px;
padding:4px 12px;
font-size:14px}
dialog{
max-height:75vh;
overflow:auto}
#otp input{
box-sizing:content-box}
</style>
<header>
Correio / Caixa de entrada</header>
<aside class="navigation">
<h2>
Área de trabalho</h2>
<p>
Visão geral</p>
<p>
Recentes</p>
<p>
Compartilhados</p>
<p>
Favoritos</p>
<hr>
<p>
Equipe Aurora</p>
<p>
Armazenamento</p>
<small>
Plano profissional</small>
</aside>
<main>
<h1>
Caixa de entrada</h1>
<section id="list">
</section>
</main>
<script src="../common.js">
</script>
<script>
let folders={
"m1": "Entrada", "m2": "Entrada", "m3": "Entrada", "m4": "Entrada"}
;
let menu;
const messages=[['m1','Fornecedor XPTO','Cotação de servidores'],['m2','Fornecedor XPTO','Nota fiscal de outubro'],['m3','Equipe Aurora','Reunião de projeto'],['m4','Compras','Cotação de monitores']];
for(let i=5;
i<=18;
i++){
folders['m'+i]='Entrada';
messages.push(['m'+i,['Marina Duarte','Carlos Almeida','Financeiro','Equipe Produto'][i%4],['Revisão do contrato','Resumo semanal','Pagamento recebido','Agenda de novembro'][i%4]]);
}
const random=seeded(91);const ranks=Object.fromEntries(messages.map(([id])=>[id,random()]));messages.sort((a,b)=>
ranks[a[0]]-ranks[b[0]]);
function draw(){
document.querySelector('#list').replaceChildren(...messages.map(([id,from,subject])=>
{
let row=h('div',{
class:'row'}
,from+' — '+subject+' · '+folders[id]);
row.append(h('small',{
}
,'Prévia da conversa · 30/10/2026'));
row.oncontextmenu=e=>
{
e.preventDefault();
menu?.remove();
const move=folder=>
{
folders[id]=folder;
menu.remove();
draw();
postState('a35-ctx-submenu',{
folders}
);
}
;
menu=h('div',{
class:'menu'}
,h('div',{
}
,'Abrir mensagem'),h('div',{
class:'parent'}
,'Mover para ▸',h('section',{
class:'menu sub'}
,h('div',{
onclick:()=>
move('Arquivo')}
,'Arquivo'),h('div',{
class:'parent'}
,'Projetos ▸',h('section',{
class:'menu sub'}
,...['Projeto Aurora','Projeto Boreal'].map(f=>
h('div',{
onclick:()=>
move('Projetos/'+f)}
,f)))))));
menu.style.left=e.clientX+'px';
menu.style.top=e.clientY+'px';
document.body.append(menu);
}
;
return row;
}
));
}
draw();
</script>
</html>
