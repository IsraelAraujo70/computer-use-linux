<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Assinatura do contrato</title><link rel="stylesheet" href="../style.css"><style>main{max-width:850px;margin:60px auto;background:white;padding:36px;border-radius:16px}button,select,input{padding:12px;margin:10px}canvas{border:1px solid #aaa;touch-action:none}li{padding:12px}label{display:block}.drop{padding:65px;border:2px dashed #678;border-radius:12px}</style><header class="topbar">Portal do cliente</header><main><h1>Assinatura do contrato</h1><p>Contrato de prestação de serviços #4821</p><h2>Assinatura</h2><canvas width="600" height="200" role="img" aria-label="Área de assinatura"></canvas><button id="clear">Limpar assinatura</button><label><input type="checkbox" id="agree">Li e concordo com os termos</label><button id="submit" disabled>Assinar contrato</button><p id="status"></p></main><script src="../common.js"></script><script>const ID="a35-canvas-signature";const c=document.querySelector('canvas'),ctx=c.getContext('2d');let last=null,length=0,min=600,max=0,signed=false;const agree=document.querySelector('#agree'),submit=document.querySelector('#submit');function state(){return {signed,agreed:agree.checked,stroke_px:length,span_x:Math.max(0,max-min)}}function emit(){postState(ID,state())}function pos(e){const r=c.getBoundingClientRect();return [ (e.clientX-r.left)*600/r.width,(e.clientY-r.top)*200/r.height] }c.onpointerdown=e=>{if(e.button!==0)return;c.setPointerCapture(e.pointerId);last=pos(e)};c.onpointermove=e=>{if(!last)return;const q=pos(e);length+=Math.hypot(q[0]-last[0],q[1]-last[1]);min=Math.min(min,last[0],q[0]);max=Math.max(max,last[0],q[0]);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...q);ctx.lineWidth=2;ctx.stroke();last=q;signed=false;submit.disabled=length===0};c.onpointerup=c.onpointercancel=()=>{last=null;emit()};agree.onchange=()=>{signed=false;emit()};document.querySelector('#clear').onclick=()=>{ctx.clearRect(0,0,600,200);length=0;min=600;max=0;signed=false;submit.disabled=true;emit()};submit.onclick=()=>{signed=agree.checked;emit();document.querySelector('#status').textContent=signed?'Contrato assinado':'Aceite os termos para continuar'};</script></html>
