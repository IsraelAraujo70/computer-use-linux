<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
<style>
body{
margin:0;
background:#f3f5f8;
color:#243247;
font:16px system-ui}
header{
background:#20334c;
color:white;
padding:24px 40px}
main{
margin:35px auto;
max-width:1200px;
background:white;
padding:32px;
border:1px solid #dce2eb;
border-radius:12px}
 .row{
padding:16px;
border-bottom:1px solid #e2e6ed;
display:flex;
gap:30px}
.cursor{
background:#e5efff;
box-shadow:inset 4px 0 #2869ce}
.menu{
position:fixed;
background:white;
border:1px solid #bac4d3;
box-shadow:0 8px 30px #0003;
min-width:210px;
z-index:10}
.menu>
div{
padding:12px;
position:relative}
.menu>
div:hover{
background:#e5efff}
.sub{
display:none;
position:absolute;
left:100%;
top:0}
.parent:hover>
.sub{
display:block}
input{
padding:12px;
font:inherit}
button{
padding:12px 20px}
dialog{
border:1px solid #ccd5e0;
border-radius:12px;
min-width:550px}
pre{
line-height:2;
color:#456}
footer{
margin-top:24px;
color:#65748a}
 .navigation{
position:absolute;
left:24px;
top:110px;
width:180px;
color:#52647a}
.navigation p{
padding:10px;
border-radius:6px;
background:#e9edf3}
main{
margin-left:240px;
margin-right:30px;
max-width:1450px}
.row{
padding:10px;
min-height:28px;
align-items:center}
.chip{
background:#edf0f9;
border-radius:12px;
padding:4px 12px;
font-size:14px}
dialog{
max-height:75vh;
overflow:auto}
#otp input{
box-sizing:content-box}
</style>
<header>
Correio / Pessoal</header>
<aside class="navigation">
<h2>
Área de trabalho</h2>
<p>
Visão geral</p>
<p>
Recentes</p>
<p>
Compartilhados</p>
<p>
Favoritos</p>
<hr>
<p>
Equipe Aurora</p>
<p>
Armazenamento</p>
<small>
Plano profissional</small>
</aside>
<main>
<h1>
Caixa de entrada</h1>
<p>
Pressione ? para ver os atalhos</p>
<section id="list">
</section>
<dialog id="help">
Atalhos: j / k navegar · x selecionar · e arquivar · s destacar · z desfazer · Escape fechar</dialog>
</main>
<script src="../common.js">
</script>
<script>
let archived=[],starred=[],selected=new Set(),cursor=0;
const messages=Array.from({
length:15}
,(_,i)=>
({
id:'m'+(i+1),from:i===6?'Banco Central':['Marina Duarte','Equipe','Loja Horizonte'][i%3],label:[1,4,8,12].includes(i)?'Promoções':'Principal',subject:['Novidades da semana','Atualização da conta','Informações para você'][i%3]}
));
const history=[];
function visible(){
return messages.filter(m=>
!archived.includes(m.id))}
function draw(){
document.querySelector('#list').replaceChildren(...visible().map((m,i)=>
h('div',{
class:'row'+(i===cursor?' cursor':'')}
,(selected.has(m.id)?'☑':'☐')+' '+(starred.includes(m.id)?'★':'☆')+' '+m.from+' — '+m.subject ,h('span',{
class:'chip'}
,m.label),h('small',{
}
,'30/10/2026'))));
}
document.onkeydown=e=>
{
if(e.key==='?'){
document.querySelector('#help').showModal();
return;
}
if(e.key==='Escape'){
document.querySelector('#help').close();
return;
}
if(document.querySelector('#help').open)return;
if(e.key==='z'&&history.length){
const old=history.pop();
archived=old.archived;
starred=old.starred;
cursor=old.cursor;
selected=new Set(old.selected);
draw();
postState('a35-kbd-gmail',{
archived,starred}
);
return;
}
if(['e','s','x'].includes(e.key))history.push({
archived:[...archived],starred:[...starred],cursor,selected:[...selected]}
);
let rows=visible(),m=rows[cursor];
if(e.key==='j')cursor=Math.min(rows.length-1,cursor+1);
else if(e.key==='k')cursor=Math.max(0,cursor-1);
else if(m&&e.key==='x'){
selected.has(m.id)?selected.delete(m.id):selected.add(m.id);
}
else if(m&&e.key==='s'){
starred.includes(m.id)?starred=starred.filter(id=>
id!==m.id):starred.push(m.id);
}
else if(m&&e.key==='e'){
archived.push(...(selected.size?[...selected]:[m.id]));
selected.clear();
cursor=Math.min(cursor,visible().length-1);
}
else return;
draw();
postState('a35-kbd-gmail',{
archived,starred}
);
}
;
draw();
</script>
</html>
