<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Cinema • Reserva de assentos</title><link rel="stylesheet" href="../style.css"><style>header{padding:24px 40px;background:#172554;color:white;font-size:24px}main{margin:24px 40px}nav{display:flex;gap:12px;margin-bottom:16px}button{padding:12px 20px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#1e3a8a}canvas{background:white;border:1px solid #cbd5e1;touch-action:none}#detail{padding:16px;font-size:18px}</style><header>Cinema • Reserva de assentos</header><main><nav id="tools"></nav><canvas width="1200" height="700" role="img" aria-label="Área de trabalho"></canvas><div id="detail">Selecione na área de trabalho</div></main><script src="../common.js"></script><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),detail=document.querySelector('#detail');const send=s=>postState('a35-canvas-seats',s).then(()=>toast('Salvo'));function button(name,fn){const b=document.createElement('button');b.textContent=name;b.onclick=fn;document.querySelector('#tools').append(b)}function pos(e){const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*1200/r.width,y:(e.clientY-r.top)*700/r.height}}function clear(){ctx.clearRect(0,0,1200,700);ctx.fillStyle='#334155';ctx.strokeStyle='#334155';ctx.font='16px Arial'}function text(s,x,y){ctx.fillStyle='#334155';ctx.fillText(s,x,y)}
let seats=[];const taken=new Set(['A3','B8','D4','F4','G9','J12']);function draw(){clear();ctx.fillStyle='#cbd5e1';ctx.fillRect(180,24,850,12);text('TELA',570,60);for(let j=0;j<14;j++)text(String(j+1),200+j*65,95);for(let i=0;i<10;i++){text('ABCDEFGHIJ'[i],150,130+i*52);for(let j=0;j<14;j++){const id='ABCDEFGHIJ'[i]+(j+1);ctx.fillStyle=taken.has(id)?'#94a3b8':seats.includes(id)?'#2563eb':'#bbf7d0';ctx.fillRect(190+j*65,110+i*52,38,32)}}detail.textContent=seats.length+' assentos selecionados'}c.onpointerdown=e=>{const q=pos(e),j=Math.floor((q.x-190)/65),i=Math.floor((q.y-110)/52);if(i<0||i>9||j<0||j>13||q.x>228+j*65||q.y>142+i*52)return;const id='ABCDEFGHIJ'[i]+(j+1);if(taken.has(id))return;seats=seats.includes(id)?seats.filter(s=>s!==id):[...seats,id];draw()};button('Confirmar assentos',()=>send({seats}));draw();</script></html>
