<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Quadro • Fluxo de pedidos</title><link rel="stylesheet" href="../style.css"><style>header{padding:24px 40px;background:#172554;color:white;font-size:24px}main{margin:24px 40px}nav{display:flex;gap:12px;margin-bottom:16px}button{padding:12px 20px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#1e3a8a}canvas{background:white;border:1px solid #cbd5e1;touch-action:none}#detail{padding:16px;font-size:18px}</style><header>Quadro • Fluxo de pedidos</header><main><nav id="tools"></nav><canvas width="1200" height="700" role="img" aria-label="Área de trabalho"></canvas><div id="detail">Selecione na área de trabalho</div></main><script src="../common.js"></script><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),detail=document.querySelector('#detail');const send=s=>postState('a35-canvas-connect',s).then(()=>toast('Salvo'));function button(name,fn){const b=document.createElement('button');b.textContent=name;b.onclick=fn;document.querySelector('#tools').append(b)}function pos(e){const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*1200/r.width,y:(e.clientY-r.top)*700/r.height}}function clear(){ctx.clearRect(0,0,1200,700);ctx.fillStyle='#334155';ctx.strokeStyle='#334155';ctx.font='16px Arial'}function text(s,x,y){ctx.fillStyle='#334155';ctx.fillText(s,x,y)}
const boxes=['Pedido recebido','Pagamento aprovado','Enviar pedido','Cancelar pedido','Estornar'].map((name,i)=>({name,x:80+i%3*380,y:i<3?160:460}));let edges=[],active=false,start=null;button('Conector',()=>active=true);function hit(q){return boxes.findIndex(b=>q.x>=b.x&&q.x<=b.x+240&&q.y>=b.y&&q.y<=b.y+80)}function draw(){clear();for(const [a,b] of edges){const x=boxes[a].x+120,y=boxes[a].y+40,X=boxes[b].x+120,Y=boxes[b].y+40,ang=Math.atan2(Y-y,X-x);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke();ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X-20*Math.cos(ang-.4),Y-20*Math.sin(ang-.4));ctx.lineTo(X-20*Math.cos(ang+.4),Y-20*Math.sin(ang+.4));ctx.fill()}for(const b of boxes){ctx.fillStyle='#dbeafe';ctx.beginPath();ctx.roundRect(b.x,b.y,240,80,12);ctx.fill();text(b.name,b.x+20,b.y+46)}}c.onpointerdown=e=>{if(active){start=hit(pos(e));c.setPointerCapture(e.pointerId)}};c.onpointerup=e=>{const end=hit(pos(e));if(start!==null&&start>=0&&end>=0&&start!==end){edges.push([start,end]);draw();send({edges})}start=null};draw();</script></html>
