<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Publicações</title>
<link rel="stylesheet" href="../style.css">
<style>body{margin:30px;
background:#f3f5f8;
color:#213047;
font:15px system-ui}main{background:white;
padding:24px;
border:1px solid #dce2ea;
border-radius:12px}button{padding:7px 14px;
cursor:pointer}#view{height:620px;
overflow:auto;
position:relative;
border:1px solid #ccd3df;
margin-top:16px}.row{position:absolute;
box-sizing:border-box;
border-bottom:1px solid #e3e8ef;
padding:6px 16px;
display:flex;
align-items:center;
justify-content:space-between;
width:100%}.cell{position:absolute;
box-sizing:border-box;
border:1px solid #e4e8ee;
padding:8px;
height:36px;
width:150px;
background:white}.sku{position:sticky;
left:0;
z-index:3;
background:#edf2f9}.head{position:sticky;
top:0;
z-index:5;
background:#dce6f3}input{padding:8px}</style>
<header style="padding:18px;background:#213047;color:white">Órbita · Central de operações</header>
<nav style="padding:16px">Visão geral　 /　 Operações　 /　 Relatórios　 /　 Configurações</nav>
<main>
<h1>Publicações</h1>
<div id="view">
</div>
</main>
<script src="../common.js">
</script>
<script>const view=document.querySelector("#view");
let count=20,busy=false;
const liked=new Set();
function render(){
view.replaceChildren();
for(let n=1;
n<=count;
n++)view.append(h('article',{style:'padding:22px;border-bottom:1px solid #ddd'},h('h3',{},`#${n} · ${n%17===0||n===237?'Marina Duarte':'Rafael Costa'}`),h('p',{},`${['Compartilhamos os resultados do projeto de atendimento. Obrigada a todos pela colaboração!','Hoje visitamos a equipe de Porto Alegre para planejar as próximas entregas.','Inscrições abertas para a oficina de sustentabilidade na comunidade.'][n%3]} · 30 out, 09:${String(n%60).padStart(2,'0')}`),h('button',{'aria-label':`Curtir publicação #${n}`,onclick:e=>{liked.has(n)?liked.delete(n):liked.add(n);
e.target.textContent=liked.has(n)?'Descurtir':'Curtir';
postState('a35-vlist-infinite',{liked:[...liked].sort((a,b)=>a-b)})}},liked.has(n)?'Descurtir':'Curtir')));
}view.onscroll=()=>{if(!busy&&count<400&&view.scrollTop+view.clientHeight>=view.scrollHeight-150){busy=true;
view.append(h('p',{role:'status'},'Carregando mais publicações…'));
setTimeout(()=>{count+=20;
busy=false;
render()},700)}};
render();
</script>
</html>
