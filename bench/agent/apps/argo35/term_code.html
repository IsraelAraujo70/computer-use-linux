<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Verificação em duas etapas</title><link rel="stylesheet" href="../style.css"><style>main{max-width:850px;margin:60px auto;background:white;padding:36px;border-radius:16px}button,select,input{padding:12px;margin:10px}canvas{border:1px solid #aaa;touch-action:none}li{padding:12px}label{display:block}.drop{padding:65px;border:2px dashed #678;border-radius:12px}</style><header class="topbar">Portal do cliente</header><main><h1>Verificação em duas etapas</h1><p>Consulte o arquivo codigo-verificacao.txt no terminal para continuar.</p><form><label>Código de verificação<input name="code" inputmode="numeric" maxlength="6" autocomplete="off"></label><button>Verificar</button></form><p id="status"></p></main><script src="../common.js"></script><script>const ID="a35-term-code";const input=document.querySelector('input');input.oninput=()=>postState(ID,{code:'',draft:input.value});document.querySelector('form').onsubmit=e=>{e.preventDefault();postState(ID,{code:input.value});document.querySelector('#status').textContent='Código enviado para verificação'};</script></html>
