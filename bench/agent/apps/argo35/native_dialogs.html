<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
<style>body{background:#f3f5fa;
color:#203047;
font-family:system-ui;
font-size:16px;
margin:0}main{max-width:1100px;
margin:60px auto;
background:white;
padding:40px;
border-radius:16px}button,input,select{font:inherit;
padding:12px;
margin:8px}article{border:1px solid #d8dfeb;
padding:24px;
margin:16px 0;
border-radius:10px}dialog{border:0;
border-radius:14px;
padding:32px}dialog::backdrop{background:#14213d88}.plans{display:flex;
gap:16px}.plans article{flex:1}.tip{position:absolute;
background:#203047;
color:white;
padding:14px;
border-radius:8px;
z-index:5}</style>
<script src="../common.js">

</script>
<header style="padding:20px;background:#203047;color:white">Órbita Workspace · Equipe Oliveira &amp; Duarte</header>
<nav style="padding:16px;background:white">Visão geral　 /　 Equipe　 /　 Documentos　 /　 Administração</nav>
<main>
<small>Órbita · Área de trabalho</small>
<h1>Projetos</h1>
<p>Gerencie os projetos da organização.</p>
<button id="restore">Restaurar última exclusão</button>
<section id="rows">
</section>
</main>
<script>const initial=['Portal do cliente','Migração fiscal','Site institucional','Central de ajuda','Projeto Legado','Projeto Legado 2','Aplicativo móvel','Integração ERP','Painel financeiro','Catálogo digital','Onboarding','Auditoria'];
let projects=[...initial];
let previous;restore.onclick=()=>{if(previous){projects=previous;previous=null;
render();
postState('a35-native-dialogs',{projects});
}};

document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='z'){e.preventDefault();restore.click();
}});function render(){rows.replaceChildren(...projects.map(name=>h('article',{},h('strong',{},name),h('span',{},' · Marina Duarte · Atualizado em 28/10/2026 · Em andamento'),h('button',{'aria-label':'Excluir '+name,onclick:async()=>{if(!confirm('Excluir o projeto '+name+'?'))return;
if(prompt('Digite o nome do projeto para confirmar')!==name)return;previous=[...projects];projects=projects.filter(n=>n!==name);
render();
await postState('a35-native-dialogs',{projects});alert('Projeto excluído');
}},'Excluir'))));
}render();

</script>
</html>
