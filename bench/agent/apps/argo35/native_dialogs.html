<!doctype html><html lang="pt-BR"><meta charset="utf-8"><link rel="stylesheet" href="../style.css"><style>body{background:#f3f5fa;color:#203047;font-family:system-ui;margin:0}main{max-width:1100px;margin:60px auto;background:white;padding:40px;border-radius:16px}button,input,select{font:inherit;padding:12px;margin:8px}article{border:1px solid #d8dfeb;padding:24px;margin:16px 0;border-radius:10px}dialog{border:0;border-radius:14px;padding:32px}dialog::backdrop{background:#14213d88}.plans{display:flex;gap:16px}.plans article{flex:1}.tip{position:absolute;background:#203047;color:white;padding:14px;border-radius:8px;z-index:5}</style><script src="../common.js"></script><main><small>Órbita · Área de trabalho</small><h1>Projetos</h1><p>Gerencie os projetos da organização.</p><section id="rows"></section></main><script>let projects=['Portal do cliente','Projeto Legado','Projeto Legado 2','Aplicativo móvel'];function render(){rows.replaceChildren(...projects.map(name=>h('article',{},h('strong',{},name),h('button',{'aria-label':'Excluir '+name,onclick:async()=>{if(!confirm('Excluir o projeto '+name+'?'))return;if(prompt('Digite o nome do projeto para confirmar')!==name)return;projects=projects.filter(n=>n!==name);render();await postState('a35-native-dialogs',{projects});alert('Projeto excluído');}},'Excluir'))));}render();</script></html>
