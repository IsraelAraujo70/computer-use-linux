</footer>
<p>
Ctrl+K ou Ctrl+Shift+P para abrir a paleta de comandos</p>
<dialog id="palette">
<input role="combobox" aria-label="Comando" aria-controls="commands" aria-expanded="true" autocomplete="off">
<div role="listbox" id="commands">
</div>
</dialog>
</main>
<script src="../common.js">
</script>
<script>
let state={
wrap:false,theme:'Escuro',indent:4,minimap:true}
;
const commands=[['Ativar quebra de linha automática',()=>
state.wrap=true],['Desativar quebra de linha automática',()=>
state.wrap=false],['Solarizado claro',()=>
state.theme='Solarizado claro'],['Tema escuro',()=>
state.theme='Escuro'],['Indentação: 2 espaços',()=>
state.indent=2],['Indentação: 4 espaços',()=>
state.indent=4],['Ocultar minimapa',()=>
state.minimap=false],['Mostrar minimapa',()=>
state.minimap=true],...Array.from({
length:33}
,(_,i)=>
[['Arquivo: abrir recente','Editor: localizar','Editor: substituir','Exibir: painel de saída','Navegar: símbolo','Terminal: selecionar perfil'][i%6]+' '+(i+1),()=>
{
}
])];
let index=0;
const dialog=document.querySelector('dialog'),input=document.querySelector('input');
function matches(){
return commands.filter(c=>
c[0].toLocaleLowerCase().includes(input.value.toLocaleLowerCase()));
}
function draw(){
document.querySelector('#commands').replaceChildren(...matches().map((c,i)=>
h('div',{
role:'option','aria-selected':i===index,class:'row'+(i===index?' cursor':'')}
,c[0])));
document.querySelector('#status').textContent='Quebra de linha: '+(state.wrap?'Ativada':'Desativada')+' · Tema: '+state.theme+' · Indentação: '+state.indent+' espaços · Minimapa: '+state.minimap;
}
input.oninput=()=>
{
index=0;
draw();
}
;
input.onkeydown=e=>
{
if(e.key==='ArrowDown'){
e.preventDefault();
index=Math.min(matches().length-1,index+1);
draw();
}
if(e.key==='ArrowUp'){
e.preventDefault();
index=Math.max(0,index-1);
draw();
}
if(e.key==='Enter'&&matches()[index]){
matches()[index][1]();
dialog.close();
draw();
postState('a35-kbd-palette',state);
}
}
;
document.addEventListener('keydown',e=>
{
if(e.ctrlKey&&(e.key.toLowerCase()==='k'||(e.shiftKey&&e.key.toLowerCase()==='p'))){
e.preventDefault();
if(!dialog.open)dialog.showModal();
input.value='';
index=0;
draw();
input.focus();
}
}
);
draw();
</script>
