<header>Workspace / Configurações de áudio</header>
<nav>Visão geral　 /　 Meu espaço　 /　 Equipe　 /　 Relatórios</nav>
<main>
<h1>Configurações de áudio</h1>
<h2>Equalizador</h2>
<p>Dispositivo de saída: Fones Studio USB · Perfil pessoal</p>
<p>Personalize os níveis para chamadas e reprodução de música.</p>
<div id="sliders">
</div>
<button>Aplicar</button>
</main>
<script src="../common.js">
</script>
<script>const ID="a35-dnd-slider";
const values={
"Volume": 60, "Graves": 50, "M\u00e9dios": 50, "Agudos": 50, "Balan\u00e7o": 50
};
let applied=false;
const panel=document.querySelector('#sliders');
for(const name of Object.keys(values)){
const out=h('span',{

},values[name]),thumb=h('div',{
class:'thumb',style:'left:'+values[name]+'%'
}),track=h('div',{
class:'track','data-name':name
},thumb);
panel.append(h('section',{

},h('strong',{

},name+' '),out,track));
track.onpointerdown=e=>{
track.setPointerCapture(e.pointerId);
const update=v=>{
values[name]=Math.max(0,Math.min(100,Math.round((v.clientX-track.getBoundingClientRect().x)/400*100)));
out.textContent=values[name];
thumb.style.left=values[name]+'%';
applied=false;
postState(ID,{
values,applied
})
};
update(e);
track.onpointermove=update;
track.onpointerup=()=>{
track.onpointermove=null
}
}
}document.querySelector('button').onclick=()=>{
applied=true;
postState(ID,{
values,applied
});
toast('Configurações aplicadas')
};
</script>
</html>
