<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Pessoas e equipes</title><link rel="stylesheet" href="../style.css"><style>main{max-width:1100px;margin:32px auto}button,input,select,textarea{margin:8px;padding:10px}iframe{width:100%;border:1px solid #ccc;border-radius:10px}table{width:100%}td,th{padding:10px;text-align:left}section{padding:20px;background:white;border:1px solid #ddd}dialog{min-width:400px}</style><body><div class="sitebar"><b>Aurora · Pessoas e equipes</b></div><main><h1>Pessoas e equipes</h1><label>Departamento<select id="dept"><option>Todos</option><option>Financeiro</option><option>Engenharia</option><option>Comercial</option></select></label><table><thead><tr><th><button id="name">Nome</button></th><th>Departamento</th><th><button id="salary">Salário</button></th><th>Status</th><th>Ações</th></tr></thead><tbody></tbody></table><button id="prev">Página anterior</button><span id="count"></span><button id="next">Próxima página</button><dialog><h2>Editar pessoa</h2><label>Status<select id="status"><option>Ativo</option><option>Promovido</option><option>Afastado</option></select></label><button id="save">Salvar</button><button id="cancel">Cancelar</button></dialog></main><script src="../common.js"></script><script>const rows=Array.from({length:60},(_,n)=>({id:'emp-'+(n+1),name:n===46?'Marina Duarte':'Colaborador '+String(n+1).padStart(2,'0'),dept:n%3===1?'Financeiro':n%3===0?'Engenharia':'Comercial',salary:n===46?18000:n===59?25000:3000+n*130,status:'Ativo'}));let pg=0,sort='name',desc=false,current;function render(){let data=rows.filter(r=>dept.value==='Todos'||r.dept===dept.value).sort((a,b)=>(sort==='salary'?a.salary-b.salary:a.name.localeCompare(b.name))*(desc?-1:1));document.querySelector('tbody').replaceChildren(...data.slice(pg*10,pg*10+10).map(r=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+r.name+'</td><td>'+r.dept+'</td><td>R$ '+r.salary.toLocaleString('pt-BR')+'</td><td>'+r.status+'</td><td><button aria-label="Ações de '+r.name+'">⋯</button></td>';tr.querySelector('button').onclick=()=>{let b=document.createElement('button');b.textContent='Editar';b.onclick=()=>{current=r;document.querySelector('#status').value=r.status;document.querySelector('dialog').showModal()};tr.lastChild.append(b)};return tr}));count.textContent='Página '+(pg+1);prev.disabled=pg===0;next.disabled=(pg+1)*10>=data.length}dept.onchange=()=>{pg=0;render()};salary.onclick=()=>{desc=sort==='salary'?!desc:true;sort='salary';pg=0;render()};document.querySelector('#name').onclick=()=>{sort='name';desc=!desc;render()};prev.onclick=()=>{pg--;render()};next.onclick=()=>{pg++;render()};save.onclick=()=>{current.status=document.querySelector('#status').value;postState('a35-table-sort-edit',{status:Object.fromEntries(rows.map(r=>[r.id,r.status]))});document.querySelector('dialog').close()};cancel.onclick=()=>document.querySelector('dialog').close();render();</script></body></html>
