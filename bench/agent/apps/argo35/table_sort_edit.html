<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Pessoas e equipes</title>
<link rel="stylesheet" href="../style.css">
<style>main{max-width:1100px;
margin:32px auto}button,input,select,textarea{margin:8px;
padding:10px}iframe{width:100%;
border:1px solid #ccc;
border-radius:10px}table{width:100%}td,th{padding:10px;
text-align:left}section{padding:20px;
background:white;
border:1px solid #ddd}dialog{min-width:400px}body{font-size:16px;
background:#f4f6fa}button,input,select{min-height:36px}h1{color:#203451}nav{color:#52617a}</style>
<body>
<div class="sitebar">
<b>Aurora · Pessoas e equipes</b>
</div>
<nav style="padding:16px;
background:#e9eef6">Visão geral　 ·　 Minha conta　 ·　 Documentos　 ·　 Ajuda</nav>
<main>
<h1>Pessoas e equipes</h1>
<label>Departamento<select id="dept">
<option>Todos</option>
<option>Financeiro</option>
<option>Engenharia</option>
<option>Comercial</option>
</select>
</label>
<table>
<thead>
<tr>
<th>
<button id="name">Nome</button>
</th>
<th>Cargo</th><th>Admissão</th><th>Departamento</th>
<th>
<button id="salary">Salário</button>
</th>
<th>Status</th>
<th>Ações</th>
</tr>
</thead>
<tbody>
</tbody>
</table>
<button id="prev">Página anterior</button>
<span id="count">
</span>
<button id="next">Próxima página</button>
<dialog>
<h2>Editar pessoa</h2>
<label>Nome<input id="editName">
</label>
<label>Cargo<input id="editRole">
</label>
<label>Admissão<input id="editHired" type="date">
</label>
<label>Status<select id="status">
<option>Ativo</option>
<option>Promovido</option>
<option>Afastado</option>
</select>
</label>
<button id="save">Salvar</button>
<button id="cancel">Cancelar</button>
</dialog>
</main>
<script src="../common.js">
</script>
<script>const rows=Array.from({length:60},(_,n)=>({id:'emp-'+(n+1),name:n===46?'Marina Duarte':['Ana','Bruno','Carla','Diego','Elisa','Fábio','Gabriela','Hugo','Isabela','João'][n%10]+' '+['Almeida','Barros','Costa','Dias','Esteves','Freitas'][Math.floor(n/10)],dept:n%3===1?'Financeiro':n%3===0?'Engenharia':'Comercial',salary:n===46?18000:n===59?25000:3000+n*130,role:'Analista',hired:'2022-05-16',status:'Ativo'}));
let pg=0,sort='name',desc=false,current;
function render(){let data=rows.filter(r=>dept.value==='Todos'||r.dept===dept.value).sort((a,b)=>(sort==='salary'?a.salary-b.salary:a.name.localeCompare(b.name))*(desc?-1:1));
document.querySelector('tbody').replaceChildren(...data.slice(pg*10,pg*10+10).map(r=>{let tr=document.createElement('tr');
tr.innerHTML='<td><b>'+r.name.split(' ').map(x=>x[0]).join('')+'</b> '+r.name+'</td><td>'+r.role+'</td><td>'+r.hired+'</td><td>'+r.dept+'</td><td>R$ '+r.salary.toLocaleString('pt-BR')+'</td><td>'+r.status+'</td><td><button aria-label="Ações de '+r.name+'">⋯</button></td>';
tr.querySelector('button').onclick=()=>{let b=document.createElement('button');
b.textContent='Editar';
b.onclick=()=>{current=r;
editName.value=r.name;
editRole.value=r.role;
editHired.value=r.hired;
document.querySelector('#status').value=r.status;
document.querySelector('dialog').showModal()};
tr.lastChild.append(b)};
return tr}));
count.textContent='Página '+(pg+1);
prev.disabled=pg===0;
next.disabled=(pg+1)*10>=data.length}dept.onchange=()=>{pg=0;
render()};
salary.onclick=()=>{desc=sort==='salary'?!desc:true;
sort='salary';
pg=0;
render()};
document.querySelector('#name').onclick=()=>{sort='name';
desc=!desc;
render()};
prev.onclick=()=>{pg--;
render()};
next.onclick=()=>{pg++;
render()};
save.onclick=()=>{current.name=editName.value;
current.role=editRole.value;
current.hired=editHired.value;
current.status=document.querySelector('#status').value;
postState('a35-table-sort-edit',{employees:rows});
document.querySelector('dialog').close();
render()};
cancel.onclick=()=>document.querySelector('dialog').close();
render();
</script>
</body>
</html>
