<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Lojas • Encontre sua unidade</title><link rel="stylesheet" href="../style.css"><style>header{padding:24px 40px;background:#172554;color:white;font-size:24px}main{margin:24px 40px}nav{display:flex;gap:12px;margin-bottom:16px}button{padding:12px 20px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#1e3a8a}canvas{background:white;border:1px solid #cbd5e1;touch-action:none}#detail{padding:16px;font-size:18px}</style><header>Lojas • Encontre sua unidade</header><main><nav id="tools"></nav><canvas width="1200" height="700" role="img" aria-label="Área de trabalho"></canvas><div id="detail">Selecione na área de trabalho</div></main><script src="../common.js"></script><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),detail=document.querySelector('#detail');const send=s=>postState('a35-canvas-map-pin',s).then(()=>toast('Salvo'));function button(name,fn){const b=document.createElement('button');b.textContent=name;b.onclick=fn;document.querySelector('#tools').append(b)}function pos(e){const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*1200/r.width,y:(e.clientY-r.top)*700/r.height}}function clear(){ctx.clearRect(0,0,1200,700);ctx.fillStyle='#334155';ctx.strokeStyle='#334155';ctx.font='16px Arial'}function text(s,x,y){ctx.fillStyle='#334155';ctx.fillText(s,x,y)}
const labels=['Loja Centro','Loja Centro-Oeste','Loja Centro Histórico','Loja Norte','Loja Sul','Loja Leste','Loja Oeste','Loja Jardim','Loja Parque','Loja Estação','Loja Lago','Loja Serra'];const pins=labels.map((name,i)=>({name,x:100+i%4*280,y:120+Math.floor(i/4)*210}));clear();for(let x=20;x<1200;x+=80){ctx.fillStyle='#e2e8f0';ctx.fillRect(x,0,18,700)}for(const pin of pins){ctx.fillStyle='#2563eb';ctx.beginPath();ctx.arc(pin.x,pin.y,12,0,7);ctx.fill();text(pin.name,pin.x-55,pin.y+32)}let selected=null;c.onpointerdown=e=>{const q=pos(e);selected=pins.findIndex(p=>Math.hypot(q.x-p.x,q.y-p.y)<=14);if(selected<0)return;detail.textContent=pins[selected].name;};button('Definir como minha loja',()=>{if(selected!==null&&selected>=0)send({my_store:'store-'+selected})});</script></html>
