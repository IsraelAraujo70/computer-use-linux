<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
<style>
body{
margin:0;
background:#f3f5f8;
color:#243247;
font:16px system-ui}
header{
background:#20334c;
color:white;
padding:24px 40px}
main{
margin:35px auto;
max-width:1200px;
background:white;
padding:32px;
border:1px solid #dce2eb;
border-radius:12px}
 .row{
padding:16px;
border-bottom:1px solid #e2e6ed;
display:flex;
gap:30px}
.cursor{
background:#e5efff;
box-shadow:inset 4px 0 #2869ce}
.menu{
position:fixed;
background:white;
border:1px solid #bac4d3;
box-shadow:0 8px 30px #0003;
min-width:210px;
z-index:10}
.menu>
div{
padding:12px;
position:relative}
.menu>
div:hover{
background:#e5efff}
.sub{
display:none;
position:absolute;
left:100%;
top:0}
.parent:hover>
.sub{
display:block}
input{
padding:12px;
font:inherit}
button{
padding:12px 20px}
dialog{
border:1px solid #ccd5e0;
border-radius:12px;
min-width:550px}
pre{
line-height:2;
color:#456}
footer{
margin-top:24px;
color:#65748a}
 .navigation{
position:absolute;
left:24px;
top:110px;
width:180px;
color:#52647a}
.navigation p{
padding:10px;
border-radius:6px;
background:#e9edf3}
main{
margin-left:240px;
margin-right:30px;
max-width:1450px}
.row{
padding:10px;
min-height:28px;
align-items:center}
.chip{
background:#edf0f9;
border-radius:12px;
padding:4px 12px;
font-size:14px}
dialog{
max-height:75vh;
overflow:auto}
#otp input{
box-sizing:content-box}
</style>

<main>
<h1>
Documentos da equipe</h1>
<p>
Clique com o botão direito para ver as ações do arquivo. Ctrl+Z desfaz a última alteração.</p>
<section id="list">
</section>
</main>
<script src="../common.js">
</script>
<script>
let files={
"f1": "rascunho-v3.docx", "f2": "contrato.pdf", "f3": "rascunho-v2.docx", "f4": "orcamento.xlsx"}
;
Object.assign(files,{
'f5': 'ata-reuniao.docx', 'f6': 'planejamento.pdf', 'f7': 'clientes.csv', 'f8': 'cronograma.xlsx', 'f9': 'marca.svg', 'f10': 'relatorio-outubro.pdf', 'f11': 'guia-equipe.pdf', 'f12': 'apresentacao.pptx', 'f13': 'custos.xlsx', 'f14': 'foto-equipe.png', 'f15': 'termos.pdf', 'f16': 'escopo.docx'}
);
const random=seeded(73);const ranks=Object.fromEntries(Object.keys(files).map(id=>[id,random()]));const list=document.querySelector('#list');
let menu;
const history=[];
document.addEventListener("keydown",e=>
{
if(e.ctrlKey&&e.key==="z"&&history.length){
e.preventDefault();
files=history.pop();
draw();
postState("a35-ctx-rename",{
files}
);
}
}
);
function draw(){
list.replaceChildren();
for(const [id,name] of Object.entries(files).sort(([a],[b])=>
ranks[a]-ranks[b])){
let row=h('div',{
class:'row'}
,h('span',{
}
,name),h('small',{
}
,'Documento · 248 KB · 28/10/2026'));
row.oncontextmenu=e=>
{
e.preventDefault();
menu?.remove();
menu=h('div',{
class:'menu'}
,...['Abrir','Renomear','Duplicar','Excluir'].map(action=>
h('div',{
onclick:()=>
{
menu.remove();
history.push({
...files}
);
if(action==='Renomear'){
let input=h('input',{
'aria-label':'Nome do arquivo',value:files[id]}
);
row.replaceChildren(input);
input.focus();
input.select();
input.onkeydown=e=>
{
if(e.key==='Enter'&&input.value.trim()){
files[id]=input.value.trim();
draw();
postState('a35-ctx-rename',{
files}
);
}
if(e.key==='Escape')draw();
}
;
}
else if(action==='Duplicar'){
files[id+'-copia']=files[id]+' (cópia)';
draw();
postState('a35-ctx-rename',{
files}
);
}
else if(action==='Excluir'){
delete files[id];
draw();
postState('a35-ctx-rename',{
files}
);
}
}
}
,action)));
menu.style.left=e.clientX+'px';
menu.style.top=e.clientY+'px';
document.body.append(menu);
}
;
list.append(row);
}
}
draw();
document.addEventListener('keydown',e=>
{
if(e.key==='Escape')menu?.remove()}
);
</script>
</html>
