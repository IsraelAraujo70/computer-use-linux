<!doctype html><html lang="pt-BR"><meta charset="utf-8"><link rel="stylesheet" href="../style.css"><style>body{margin:0;background:#f3f5f8;color:#243247;font:16px system-ui}header{background:#20334c;color:white;padding:24px 40px}main{margin:35px auto;max-width:1200px;background:white;padding:32px;border:1px solid #dce2eb;border-radius:12px} .row{padding:16px;border-bottom:1px solid #e2e6ed;display:flex;gap:30px}.cursor{background:#e5efff;box-shadow:inset 4px 0 #2869ce}.menu{position:fixed;background:white;border:1px solid #bac4d3;box-shadow:0 8px 30px #0003;min-width:210px;z-index:10}.menu>div{padding:12px;position:relative}.menu>div:hover{background:#e5efff}.sub{display:none;position:absolute;left:100%;top:0}.parent:hover>.sub{display:block}input{padding:12px;font:inherit}button{padding:12px 20px}dialog{border:1px solid #ccd5e0;border-radius:12px;min-width:550px}pre{line-height:2;color:#456}footer{margin-top:24px;color:#65748a}</style><header>Arquivos / Documentos</header><main><h1>Documentos da equipe</h1><p>Clique com o botão direito para ver as ações do arquivo.</p><section id="list"></section></main><script src="../common.js"></script><script>let files={"f1": "rascunho-v3.docx", "f2": "contrato.pdf", "f3": "rascunho-v2.docx", "f4": "orcamento.xlsx"};const list=document.querySelector('#list');let menu;function draw(){list.replaceChildren();for(const [id,name] of Object.entries(files)){let row=h('div',{class:'row'},name);row.oncontextmenu=e=>{e.preventDefault();menu?.remove();menu=h('div',{class:'menu'},...['Abrir','Renomear','Duplicar','Excluir'].map(action=>h('div',{onclick:()=>{menu.remove();if(action==='Renomear'){let input=h('input',{'aria-label':'Nome do arquivo',value:files[id]});row.replaceChildren(input);input.focus();input.select();input.onkeydown=e=>{if(e.key==='Enter'&&input.value.trim()){files[id]=input.value.trim();draw();postState('a35-ctx-rename',{files});}if(e.key==='Escape')draw();};}else if(action==='Duplicar'){files[id+'-copia']=files[id]+' (cópia)';draw();postState('a35-ctx-rename',{files});}else if(action==='Excluir'){delete files[id];draw();postState('a35-ctx-rename',{files});}}},action)));menu.style.left=e.clientX+'px';menu.style.top=e.clientY+'px';document.body.append(menu);};list.append(row);}}draw();document.addEventListener('keydown',e=>{if(e.key==='Escape')menu?.remove()});</script></html>
