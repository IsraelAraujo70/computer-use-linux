<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Novo chamado</title>
<link rel="stylesheet" href="../style.css">
<style>main{max-width:1100px;
margin:32px auto}button,input,select,textarea{margin:8px;
padding:10px}iframe{width:100%;
border:1px solid #ccc;
border-radius:10px}table{width:100%}td,th{padding:10px;
text-align:left}section{padding:20px;
background:white;
border:1px solid #ddd}dialog{min-width:400px}body{font-size:16px;
background:#f4f6fa}button,input,select{min-height:36px}h1{color:#203451}nav{color:#52617a}</style>
<body>
<div class="sitebar">
<b>Aurora · Novo chamado</b>
</div>
<nav style="padding:16px;
background:#e9eef6">Visão geral　 ·　 Minha conta　 ·　 Documentos　 ·　 Ajuda</nav>
<main>
<h1>Novo chamado</h1>
<form>
<label>Número do pedido<input name="order" required>
</label>
<br>
<label>Motivo<select name="reason">
<option>Dúvida</option>
<option>Produto com defeito</option>
<option>Entrega atrasada</option>
</select>
</label>
<br>
<label>Descrição<textarea name="description" required>
</textarea>
</label>
<br>
<button>Enviar</button>
</form>
</main>
<script src="../common.js">
</script>
<script>document.querySelector('form').oninput=e=>postState('a35-iframe-nested',Object.fromEntries(new FormData(e.currentTarget)));
document.querySelector('form').onsubmit=e=>{e.preventDefault();
postState('a35-iframe-nested',Object.fromEntries(new FormData(e.target)));
toast('Chamado enviado')};
</script>
</body>
</html>
