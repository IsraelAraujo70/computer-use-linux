<!doctype html><html lang="pt-BR"><meta charset="utf-8"><link rel="stylesheet" href="../style.css"><style>body{background:#f3f5fa;color:#203047;font-family:system-ui;margin:0}main{max-width:1100px;margin:60px auto;background:white;padding:40px;border-radius:16px}button,input,select{font:inherit;padding:12px;margin:8px}article{border:1px solid #d8dfeb;padding:24px;margin:16px 0;border-radius:10px}dialog{border:0;border-radius:14px;padding:32px}dialog::backdrop{background:#14213d88}.plans{display:flex;gap:16px}.plans article{flex:1}.tip{position:absolute;background:#203047;color:white;padding:14px;border-radius:8px;z-index:5}</style><script src="../common.js"></script><main><small>Órbita · Área de trabalho</small><h1>Integrações</h1><article><h2>Google Drive</h2><p>Sincronize documentos da sua equipe.</p><button id="connect">Conectar Google Drive</button><p id="status">Não conectado</p></article><button id="save">Salvar integrações</button></main><script>let drive={connected:false,account:null},popup;connect.onclick=()=>popup=window.open('popup_oauth-auth.html','oauth','width=520,height=640');window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==popup||!['israel@empresa.com','israel.pessoal@gmail.com'].includes(e.data?.account))return;drive={connected:true,account:e.data.account};document.getElementById('status').textContent='Conectado como '+drive.account;postState('a35-popup-oauth',{drive});});save.onclick=async()=>{await postState('a35-popup-oauth',{drive});toast('Integrações salvas');};</script></html>
