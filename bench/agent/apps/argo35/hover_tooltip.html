<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
<style>body{background:#f3f5fa;
color:#203047;
font-family:system-ui;
font-size:16px;
margin:0}main{max-width:1100px;
margin:60px auto;
background:white;
padding:40px;
border-radius:16px}button,input,select{font:inherit;
padding:12px;
margin:8px}article{border:1px solid #d8dfeb;
padding:24px;
margin:16px 0;
border-radius:10px}dialog{border:0;
border-radius:14px;
padding:32px}dialog::backdrop{background:#14213d88}.plans{display:flex;
gap:16px}.plans article{flex:1}.tip{position:absolute;
background:#203047;
color:white;
padding:14px;
border-radius:8px;
z-index:5}</style>
<script src="../common.js">

</script>
<header style="padding:20px;background:#203047;color:white">Órbita Workspace · Equipe Oliveira &amp; Duarte</header>
<nav style="padding:16px;background:white">Visão geral　 /　 Equipe　 /　 Documentos　 /　 Administração</nav>
<main>
<small>Órbita · Área de trabalho</small>
<h1>Planos para sua equipe</h1>
<p>Escolha o atendimento adequado para sua operação.</p>
<section class="plans" id="plans">
</section>
</main>
<script>const plansData=[['start','Essencial',49,'e-mail em até 48h'],['pro','Profissional · Recomendado',99,'chat em horário comercial'],['business','Negócios',179,'Suporte 24h por telefone'],['enterprise','Corporativo',299,'Gerente dedicado em dias úteis']];for(const [id,name,price,support] of plansData){const card=h('article',{},h('h2',{},name),h('h3',{},'R$ '+price+'/mês'));for(const [label,text] of [['Usuários','Até 25 usuários por equipe'],['Suporte',support],['Armazenamento','Documentos com backup automático'],['Relatórios','Exportação mensal em PDF'],['Segurança','Autenticação em duas etapas'],['Integrações','Conectores para sua equipe']]){const icon=h('span',{'aria-label':'Informações sobre '+label,style:'cursor:help;display:inline-block;padding:10px'},'ⓘ');
let tip;icon.onmouseenter=()=>{tip=h('div',{class:'tip',role:'tooltip'},text);icon.append(tip);
};
icon.onmouseleave=()=>{tip?.remove();
tip=null;
};

card.append(h('p',{},label,icon));
}card.append(h('button',{onclick:async()=>{await postState('a35-hover-tooltip',{plan:id});toast('Plano '+name+' contratado');
}},'Assinar'));plans.append(card);
}
</script>
</html>
