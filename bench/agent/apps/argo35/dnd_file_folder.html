<header>Workspace / Arquivos</header>
<nav>Visão geral　 /　 Meu espaço　 /　 Equipe　 /　 Relatórios</nav>
<main>
<h1>Arquivos</h1>
<div style="display:flex;gap:20px">
<div class="folder" data-folder="Financeiro 2026">📁 Financeiro 2026</div>
<div class="folder" data-folder="Financeiro 2025">📁 Financeiro 2025</div>
<div class="folder" data-folder="Projetos">📁 Projetos</div>
<div class="folder" data-folder="Equipe">📁 Equipe</div>
</div>
<div id="files" style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:30px">
</div>
</main>
<script src="../common.js">
</script>
<script>const ID="a35-dnd-file-folder";
const locationState={
"contrato-assinado.pdf": null, "nota-fiscal-0931.xml": null, "contrato-rascunho.pdf": null, "relatorio.pdf": null, "orcamento.xlsx": null, "logo.png": null, "ata.docx": null, "foto.jpg": null, "manual.pdf": null, "dados.csv": null, "proposta.pdf": null, "recibo.pdf": null, "agenda.txt": null, "backup.zip": null
};
const grid=document.querySelector('#files');
let current = null;

const folders = [...document.querySelectorAll('.folder')];

const back = h('button', {

}, '← Voltar');

const crumb = h('div', {
class:'folder'
}, 'Arquivos');

grid.before(back, crumb);

function render() {

 back.hidden = current === null;

 crumb.textContent = current ? 'Arquivos / ' + current : 'Arquivos';

 folders.forEach(el => el.hidden = current !== null);

 const names = Object.keys(locationState);

 const ordered = names.slice();
 let seed = 731;
 for (let i = ordered.length - 1; i > 0; i--) {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  const j = seed % (i + 1);
  [ordered[i], ordered[j]] = [ordered[j], ordered[i]];
 }

 grid.replaceChildren(...ordered.filter(n => locationState[n] === current).map((n,i) =>
  h('div', {
class:'file', draggable:'true', 'data-name':n,
   ondragstart:e => e.dataTransfer.setData('text/plain', n)
},
   '📄 ' + n, h('small', {

}, (48+i*23)+' KB · 28/10/2026'))));


}
back.onclick = () => {
 current = null;
 render();

};

function acceptDrop(el, destination) {

 el.ondragover = e => {
 e.preventDefault();
 e.dataTransfer.dropEffect = 'move';

};

 el.ondrop = e => {

  e.preventDefault();

  const name = e.dataTransfer.getData('text/plain');

  if (!Object.hasOwn(locationState, name)) return;

  locationState[name] = destination;

  render();

  postState(ID, {
location:locationState
});


};


}
for (const el of folders) {

 acceptDrop(el, el.dataset.folder);

 el.onclick = () => {
 current = el.dataset.folder;
 render();

};


}
acceptDrop(crumb, null);

render();

</script>
</html>
