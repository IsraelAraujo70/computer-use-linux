<!doctype html><html lang="pt-BR"><meta charset="utf-8"><link rel="stylesheet" href="../style.css"><style>body{margin:0;background:#eef2f6;color:#24334a;font:16px system-ui}header{background:#172d49;color:white;padding:24px 40px}main{margin:32px 40px;background:white;padding:28px;border-radius:12px} .row,.card{padding:18px;margin:8px 0;background:#f6f8fc;border:1px solid #d5deea;border-radius:7px;user-select:none;touch-action:none}.handle{cursor:grab;padding:10px}.placeholder{height:56px;border:2px dashed #477bcc;background:#edf4ff;margin:8px 0}.col{background:#edf1f7;padding:15px;flex:1;min-height:600px}.card{cursor:grab}.track{width:400px;height:12px;background:#c9d7e8;position:relative;margin:28px 0;touch-action:none;cursor:pointer}.thumb{position:absolute;width:24px;height:24px;border-radius:50%;background:#286aca;top:-6px;transform:translateX(-50%)}button{padding:12px 25px} .file,.folder{padding:24px;background:#f1f5fa;border:1px solid #cad6e4;border-radius:8px;min-height:65px}.folder{background:#fff2cc}</style><header>Workspace / Arquivos</header><main><h1>Arquivos</h1><div style="display:flex;gap:20px"><div class="folder" data-folder="Financeiro 2026">📁 Financeiro 2026</div><div class="folder" data-folder="Financeiro 2025">📁 Financeiro 2025</div><div class="folder" data-folder="Projetos">📁 Projetos</div><div class="folder" data-folder="Equipe">📁 Equipe</div></div><div id="files" style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:30px"></div></main><script src="../common.js"></script><script>const ID="a35-dnd-file-folder";const locationState={"contrato-assinado.pdf": null, "nota-fiscal-0931.xml": null, "contrato-rascunho.pdf": null, "relatorio.pdf": null, "orcamento.xlsx": null, "logo.png": null, "ata.docx": null, "foto.jpg": null, "manual.pdf": null, "dados.csv": null, "proposta.pdf": null, "recibo.pdf": null, "agenda.txt": null, "backup.zip": null};const grid=document.querySelector('#files');function render(){grid.replaceChildren(...Object.keys(locationState).filter(n=>!locationState[n]).map(n=>h('div',{class:'file',draggable:'true','data-name':n,ondragstart:e=>e.dataTransfer.setData('text/plain',n)},'📄 '+n)))}render();for(const el of document.querySelectorAll('.folder')){el.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move'};el.ondrop=e=>{e.preventDefault();const n=e.dataTransfer.getData('text/plain');if(Object.hasOwn(locationState,n)){locationState[n]=el.dataset.folder;render();el.textContent='📁 '+el.dataset.folder+' · '+Object.values(locationState).filter(x=>x===el.dataset.folder).length;postState(ID,{location:locationState})}}}</script></html>
