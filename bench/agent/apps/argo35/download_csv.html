<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Relatórios de vendas</title><link rel="stylesheet" href="../style.css"><style>main{max-width:850px;margin:60px auto;background:white;padding:36px;border-radius:16px}button,select,input{padding:12px;margin:10px}canvas{border:1px solid #aaa;touch-action:none}li{padding:12px}label{display:block}.drop{padding:65px;border:2px dashed #678;border-radius:12px}</style><header class="topbar">Portal do cliente</header><main><h1>Relatórios de vendas</h1><label>Período<select id="period"><option value="2026-11">Novembro 2026</option><option value="2026-10">Outubro 2026</option><option value="2026-09">Setembro 2026</option></select></label><label>Região<select id="region"><option>Norte</option><option>Sul</option><option>Sudeste</option></select></label><button>Baixar CSV</button></main><script src="../common.js"></script><script>const ID="a35-download-csv";const period=document.querySelector('#period'),region=document.querySelector('#region');function state(downloaded=null,rows=0){return {downloaded,rows,period:period.value,region:region.value}}period.onchange=region.onchange=()=>postState(ID,state());document.querySelector('button').onclick=()=>{const r=region.value,p=period.value;const text='pedido,regiao,periodo,valor\n'+[['4821','1250.00'],['4822','890.00'],['4823','430.00']].map(([id,v])=>[id,r,p,v].join(',')).join('\n')+'\n';const filename='relatorio-'+r.toLowerCase()+'-'+p+'.csv';const url=URL.createObjectURL(new Blob([text],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);postState(ID,state(filename,3))};</script></html>
