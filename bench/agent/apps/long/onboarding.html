<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Admissão de colaborador</title><link rel="stylesheet" href="../style.css"><main class="page"><h1>Admissão de colaborador</h1><p id="indicator" role="status"></p><div id="content"></div><button id="back" class="btn">Voltar</button> <button id="next" class="btn primary">Próximo</button></main><script src="../common.js"></script><script>
const groups=[[["name", "Nome completo", "Larissa Gomes Pereira"], ["cpf", "CPF", "123.456.789-09"], ["birth", "Data de nascimento", "14/03/1992"], ["phone", "Telefone", "(31) 99876-5432"], ["email", "E-mail", "larissa.pereira@example.com"], ["marital", "Estado civil", "Casado(a)"]], [["cep", "CEP", "30140-071"], ["street", "Rua", "Rua da Bahia"], ["number", "Número", "1148"], ["complement", "Complemento", "Apto 502"], ["neighborhood", "Bairro", "Centro"], ["city", "Cidade", "Belo Horizonte"], ["state", "Estado", "Minas Gerais"]], [["bank", "Banco", "341 - Itaú"], ["branch", "Agência", "1234"], ["account", "Conta", "56789-0"], ["accountType", "Tipo de conta", "Corrente"], ["pixType", "Tipo de chave Pix", "E-mail"], ["pixKey", "Chave Pix", "larissa.pereira@example.com"]]], options={"marital": ["Solteiro(a)", "Casado(a)", "Divorciado(a)", "Viúvo(a)"], "state": ["Acre", "Alagoas", "Amapá", "Amazonas", "Bahia", "Ceará", "Distrito Federal", "Espírito Santo", "Goiás", "Maranhão", "Mato Grosso", "Mato Grosso do Sul", "Minas Gerais", "Pará", "Paraíba", "Paraná", "Pernambuco", "Piauí", "Rio de Janeiro", "Rio Grande do Norte", "Rio Grande do Sul", "Rondônia", "Roraima", "Santa Catarina", "São Paulo", "Sergipe", "Tocantins"], "bank": ["001 - Banco do Brasil", "104 - Caixa Econômica Federal", "237 - Bradesco", "260 - Nu Pagamentos", "341 - Itaú"], "pixType": ["CPF", "E-mail", "Telefone", "Aleatória"], "relation": ["Cônjuge", "Filho(a)", "Enteado(a)"]};
const data={dependents:[]}, titles=['Dados pessoais','Endereço','Dados bancários','Dependentes','Revisão'];let step=0, serial=0;
const content=document.getElementById('content'), next=document.getElementById('next'), back=document.getElementById('back');
function field(key,label,target,holder){const id='f'+(++serial), wrap=h('div',{class:'field'});let input;
if(key==='accountType'){input=h('div');for(const value of ['Corrente','Poupança']){const rid=id+value;input.append(h('input',{id:rid,type:'radio',name:'accountType',value,checked:target[key]===value,onchange:()=>target[key]=value}),h('label',{for:rid},value));}}
else {input=options[key]?h('select',{id},h('option',{value:''},'Selecione'),...options[key].map(v=>h('option',{value:v},v))):h('input',{id});input.value=target[key]||'';input.oninput=()=>{let v=input.value;if(['cpf','phone','cep'].includes(key)){let d=v.replace(/\D/g,'');if(key==='cpf')v=d.slice(0,11).replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})(\d{1,2})$/,'$1-$2');if(key==='cep')v=d.slice(0,8).replace(/^(\d{5})(\d)/,'$1-$2');if(key==='phone')v=d.slice(0,11).replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d{1,4})$/,'$1-$2');input.value=v;}target[key]=v;};wrap.append(h('label',{for:id},label));}
wrap.append(input,h('span',{class:'error',role:'alert','data-key':key}));holder.append(wrap);}
function render(){content.replaceChildren(h('h2',{},titles[step]));document.getElementById('indicator').textContent=`Etapa ${step+1} de 5 — ${titles[step]}`;back.disabled=step===0;next.textContent=step===4?'Confirmar admissão':'Próximo';if(step<3)for(const [k,l] of groups[step])field(k,l,data,content);if(step===3){data.dependents.forEach((d,i)=>{const fs=h('fieldset',{},h('legend',{},`Dependente ${i+1}`));for(const [k,l] of [['name','Nome do dependente'],['relation','Parentesco'],['birth','Data de nascimento do dependente']])field(k,l,d,fs);fs.append(h('button',{class:'btn',onclick:()=>{data.dependents.splice(i,1);render();}},`Remover dependente ${i+1}`));content.append(fs);});content.append(h('button',{class:'btn',onclick:()=>{data.dependents.push({});render();}},'Adicionar dependente'));}if(step===4){for(const [k,l] of groups.flat())content.append(h('p',{},l+': '+(data[k]||'')));data.dependents.forEach(d=>content.append(h('p',{},`${d.name} — ${d.relation} — ${d.birth}`)));}}
function validate(){let ok=true;content.querySelectorAll('.field').forEach(w=>{const inputs=[...w.querySelectorAll('input,select')],key=w.querySelector('.error').dataset.key;const value=inputs[0].type==='radio'?inputs.find(i=>i.checked)?.value:inputs[0].value;const invalid=key!=='complement'&&!value?.trim();w.querySelector('.error').textContent=invalid?'Preencha este campo.':'';if(invalid)ok=false;});return ok;}
back.onclick=()=>{step--;render();};next.onclick=async()=>{if(!validate())return;if(step<4){step++;render();}else{next.disabled=true;try{await postState('long-onboarding',{admission:data});toast('Admissão confirmada');}catch(e){toast(e.message);next.disabled=false;}}};render();
</script></html>
