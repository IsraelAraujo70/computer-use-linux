<body><main class="page" id="main"><h1>Leads</h1><div class="field"><label for="search">Buscar lead</label><input id="search"></div><table class="data"><caption>Leads</caption><thead><tr><th>Nome</th><th>Empresa</th><th>Status</th><th>Valor do contrato</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table><nav id="pages" aria-label="Paginação"></nav></main><script src="../common.js"></script><script>

nts": 0, "notes": ""}, "lead-19": {"name": "Contato 19", "company": "Empresa 19", "status": "Novo", "value_cents": 0, "notes": ""}, "lead-20": {"name": "Contato 20", "company": "Empresa 20", "status": "Novo", "value_cents": 0, "notes": ""}, "lead-21": {"name": "Contato 21", "company": "Empresa 21", "status": "Novo", "value_cents": 0, "notes": ""}, "lead-22": {"name": "Contato 22", "company": "Empresa 22", "status": "Novo", "value_cents": 0, "notes": ""}, "lead-23": {"name": "Contato 23", "company": "Empresa 23", "status": "Novo", "value_cents": 0, "notes": ""}, "lead-24": {"name": "Elisa Prado", "company": "Prado Eventos", "status": "Novo", "value_cents": 0, "notes": ""}, "lead-25": {"name": "Contato 25", "company": "Empresa 25", "status": "Novo", "value_cents": 0, "notes": ""}, "lead-26": {"name": "Contato 26", "company": "Empresa 26", "status": "Novo", "value_cents": 0, "notes": ""}, "lead-27": {"name": "Contato 27", "company": "Empresa 27", "status": "Novo", "value_cents": 0, "notes": ""}, "lead-28": {"name": "Rafael Souza (duplicado)", "company": "Souza Consultoria", "status": "Novo", "value_cents": 0, "notes": ""}, "lead-29": {"name": "Contato 29", "company": "Empresa 29", "status": "Novo", "value_cents": 0, "notes": ""}, "lead-30": {"name": "Contato 30", "company": "Empresa 30", "status": "Novo", "value_cents": 0, "notes": ""}};
let current=1;
const main=document.getElementById('main'), rows=document.getElementById('rows'), search=document.getElementById('search');
const money=c=>(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function render(){
 const filtered=Object.entries(leads).filter(([id,l])=>l.name.toLocaleLowerCase('pt-BR').includes(search.value.toLocaleLowerCase('pt-BR')));
 const total=Math.max(1,Math.ceil(filtered.length/15)); current=Math.min(current,total);
 rows.replaceChildren(...filtered.slice((current-1)*15,current*15).map(([id,l])=>h('tr',{},h('td',{},l.name),h('td',{},l.company),h('td',{},l.status),h('td',{},'R$ '+money(l.value_cents)),h('td',{},h('button',{onclick:()=>edit(id)},'Editar '+l.name),h('button',{onclick:()=>remove(id)},'Excluir '+l.name)))));
 document.getElementById('pages').replaceChildren(...[['Página anterior',current-1],['Página 1',1],['Página 2',2],['Próxima página',current+1]].map(([name,n])=>h('button',{disabled:n<1||n>total,onclick:()=>{current=n;render();},'aria-current':n===current?'page':null},name)));
}
function modal(title){
 const origin=document.activeElement;
 const box=h('div',{class:'dialog',role:'dialog','aria-modal':'true','aria-labelledby':'dialog-title'},h('h2',{id:'dialog-title'},title));
 const backdrop=h('div',{class:'backdrop'},box); document.body.append(backdrop);main.inert=true;
 const close=()=>{backdrop.remove();main.inert=false;origin.focus();};
 backdrop.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const controls=[...box.querySelectorAll('input,select,textarea,button')];const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 return {box,close};
}
function edit(id){
 const l=leads[id],{box,close}=modal('Editar lead');
 const status=h('select',{id:'status'},...['Novo','Em negociação','Cliente','Perdido'].map(s=>h('option',{selected:s===l.status},s)));
 const value=h('input',{id:'value',value:money(l.value_cents),inputmode:'decimal'}),notes=h('textarea',{id:'notes'},l.notes),error=h('p',{class:'error',role:'alert'});
 const save=h('button',{type:'submit'},'Salvar');
 const form=h('form',{novalidate:true},h('div',{class:'field'},h('label',{for:'status'},'Status'),status),h('div',{class:'field'},h('label',{for:'value'},'Valor do contrato'),value,error),h('div',{class:'field'},h('label',{for:'notes'},'Observações'),notes),h('div',{class:'actions'},h('button',{type:'button',onclick:close},'Cancelar'),save));
 form.onsubmit=async e=>{e.preventDefault();const raw=value.value.trim().replace(/^R\$\s*/, '');const valid=/^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(raw);const cents=Math.round(Number(raw.replaceAll('.','').replace(',','.'))*100);if(!valid||!Number.isSafeInteger(cents)||(status.value==='Cliente'&&cents<=0)){error.textContent='Informe um valor válido maior que zero para Cliente.';return;}save.disabled=true;const next={...leads,[id]:{...l,status:status.value,value_cents:cents,notes:notes.value}};try{await postState('long-crm',{leads:next});leads[id]=next[id];close();render();toast('Lead salvo');}catch(e){error.textContent=e.message;save.disabled=false;}};
 box.append(form);status.focus();
}
function remove(id){const {box,close}=modal('Excluir lead?');const error=h('p',{class:'error',role:'alert'});const confirm=h('button',{onclick:async()=>{confirm.disabled=true;const next={...leads};delete next[id];try{await postState('long-crm',{leads:next});delete leads[id];close();render();toast('Lead excluído');}catch(e){error.textContent=e.message;confirm.disabled=false;}}},'Excluir');box.append(h('p',{},leads[id].name),error,h('button',{onclick:close},'Cancelar'),confirm);confirm.focus();}
search.oninput=()=>{current=1;render();};render();
</script></body></html>
