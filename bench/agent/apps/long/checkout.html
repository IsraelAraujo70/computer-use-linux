<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Loja Aurora</title><link rel="stylesheet" href="../style.css"><style>.shop{display:grid;grid-template-columns:2fr 1fr;gap:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}article,aside{border:1px solid #ddd;padding:16px;border-radius:12px}input{max-width:100%}</style><body><main class="page"><h1>Loja Aurora</h1><div class="shop"><section><div class="field"><label for="search">Buscar produtos</label><input id="search"></div><div class="field"><label for="category">Categoria</label><select id="category"><option>Todas</option><option>Casa</option><option>Papelaria</option><option>Acessórios</option></select></div><div id="grid" class="grid"></div></section><aside><h2>Carrinho</h2><div id="cart"></div><p id="subtotal"></p><div class="field"><label for="coupon">Cupom</label><input id="coupon"><span id="coupon-error" class="error" role="alert"></span></div><button id="apply">Aplicar cupom</button><p id="discount"></p><button id="shipping">Ir para entrega</button><p id="cart-error" class="error" role="alert"></p></aside></div><section id="delivery" hidden><h2>Entrega</h2><div id="address"></div><fieldset id="methods"><legend>Opção de entrega</legend></fieldset><button id="pay">Ir para pagamento</button></section><section id="payment" hidden><h2>Pagamento</h2><fieldset id="payments"><legend>Forma de pagamento</legend></fieldset><p id="total"></p><p id="payment-error" class="error" role="alert"></p><button id="finish">Finalizar pedido</button></section></main><script src="../common.js"></script><script>
const products=[["Caneca Aurora 300 ml", 2990, "Casa"], ["Caneca Aurora 450 ml", 3990, "Casa"], ["Caderno pontilhado A5", 2490, "Papelaria"], ["Caderno pautado A5", 2290, "Papelaria"], ["Garrafa térmica 750 ml", 8990, "Casa"], ["Lápis grafite 2B", 350, "Papelaria"], ["Estojo azul", 1990, "Papelaria"], ["Borracha branca", 250, "Papelaria"], ["Caneta preta", 590, "Papelaria"], ["Marca-texto amarelo", 690, "Papelaria"], ["Agenda anual", 4590, "Papelaria"], ["Régua 30 cm", 490, "Papelaria"], ["Prato cerâmico", 3290, "Casa"], ["Vaso pequeno", 2590, "Casa"], ["Toalha de rosto", 2290, "Casa"], ["Almofada verde", 4990, "Casa"], ["Bolsa de algodão", 3590, "Acessórios"], ["Chaveiro estrela", 990, "Acessórios"], ["Carteira compacta", 5990, "Acessórios"], ["Necessaire floral", 2990, "Acessórios"]];const $=id=>document.getElementById(id);const cart=new Map();let coupon='';const money=n=>(n/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function field(id,label,type='text'){return h('div',{class:'field'},h('label',{for:id},label),h('input',{id,type}),h('span',{id:id+'-error',class:'error',role:'alert'}));}
function render(){ $('grid').replaceChildren(...products.filter(([name,,cat])=>name.toLocaleLowerCase().includes($('search').value.toLocaleLowerCase())&&($('category').value==='Todas'||cat===$('category').value)).map(([name,price,cat],i)=>{const id='product-'+products.findIndex(p=>p[0]===name);const input=h('input',{id,type:'number',min:1,value:1});const err=h('span',{class:'error',role:'alert'});return h('article',{},h('h3',{},name),h('p',{},cat+' • '+money(price)),h('label',{for:id},'Quantidade de '+name),input,err,h('button',{onclick:()=>{const qty=Number(input.value);if(!Number.isInteger(qty)||qty<1){err.textContent='Informe uma quantidade válida';return;}cart.set(name,(cart.get(name)||0)+qty);renderCart();}},'Adicionar '+name+' ao carrinho'));}));}
const subtotal=()=>[...cart].reduce((s,[name,qty])=>s+products.find(p=>p[0]===name)[1]*qty,0);
function renderCart(){ $('cart').replaceChildren(...[...cart].map(([name,qty],i)=>h('div',{},h('label',{for:'cart-'+i},'Quantidade no carrinho de '+name),h('input',{id:'cart-'+i,type:'number',min:1,value:qty,onchange:e=>{const n=Number(e.target.value);if(!Number.isInteger(n)||n<1){e.target.value=qty;return;}cart.set(name,n);renderCart();}}),h('button',{onclick:()=>{cart.delete(name);renderCart();}},'Remover '+name))));$('subtotal').textContent='Subtotal: '+money(subtotal());$('discount').textContent=coupon?'Desconto: '+money(Math.round(subtotal()/10)):'';}
$('search').oninput=render;$('category').onchange=render;
$('apply').onclick=()=>{if($('coupon').value.trim().toUpperCase()!=='BEMVINDO10'){$('coupon-error').textContent='Cupom inválido';return;}coupon='BEMVINDO10';$('coupon-error').textContent='';renderCart();};
$('shipping').onclick=()=>{if(!cart.size){$('cart-error').textContent='Adicione produtos ao carrinho';return;}$('delivery').hidden=false;$('delivery').scrollIntoView();};
const fields=[['cep','CEP'],['street','Rua'],['number','Número'],['complement','Complemento'],['city','Cidade']];for(const [id,label] of fields)$('address').append(field(id,label));
const states='Acre|Alagoas|Amapá|Amazonas|Bahia|Ceará|Distrito Federal|Espírito Santo|Goiás|Maranhão|Mato Grosso|Mato Grosso do Sul|Minas Gerais|Pará|Paraíba|Paraná|Pernambuco|Piauí|Rio de Janeiro|Rio Grande do Norte|Rio Grande do Sul|Rondônia|Roraima|Santa Catarina|São Paulo|Sergipe|Tocantins'.split('|');$('address').append(h('div',{class:'field'},h('label',{for:'state'},'Estado'),h('select',{id:'state'},h('option',{value:''},'Selecione'),...states.map(s=>h('option',{},s))),h('span',{id:'state-error',class:'error',role:'alert'})));
function radios(target,name,values){values.forEach(([value,label],i)=>$(target).append(h('input',{id:name+i,type:'radio',name,value}),h('label',{for:name+i},label)));$(target).append(h('p',{id:name+'-error',class:'error',role:'alert'}));}
radios('methods','delivery',[['Econômica','Econômica R$ 9,90'],['Expressa','Expressa R$ 24,90'],['Retirar na loja','Retirar na loja R$ 0,00']]);radios('payments','payment',[['Pix','Pix'],['Cartão de crédito','Cartão de crédito'],['Boleto','Boleto']]);
const selected=name=>document.querySelector('input[name="'+name+'"]:checked')?.value;
function validate(){let ok=true;for(const id of ['cep','street','number','city','state']){const valid=id==='cep'?$('cep').value.replace(/\D/g,'').length===8:!!$(id).value.trim();$(id+'-error').textContent=valid?'':'Preencha '+(id==='cep'?'um CEP válido':id);ok=ok&&valid;}$('delivery-error').textContent=selected('delivery')?'':'Selecione uma entrega';return ok&&!!selected('delivery');}
const total=()=>subtotal()-(coupon?Math.round(subtotal()/10):0)+({'Expressa':2490,'Econômica':990,'Retirar na loja':0}[selected('delivery')]||0);
$('pay').onclick=()=>{if(!validate())return;$('payment').hidden=false;$('total').textContent='Total: '+money(total());$('payment').scrollIntoView();};
$('finish').onclick=async()=>{if(!validate()||!cart.size)return;if(!selected('payment')){$('payment-error').textContent='Selecione uma forma de pagamento';return;}const address=Object.fromEntries([...fields.map(([id])=>[id,$(id).value]),['state',$('state').value]]);await postState('long-checkout',{order:{items:[...cart].map(([name,qty])=>({name,qty,unit_cents:products.find(p=>p[0]===name)[1]})),coupon,address,delivery:selected('delivery'),payment:selected('payment'),total_cents:total()}});toast('Pedido realizado');};render();renderCart();
</script></body></html>
